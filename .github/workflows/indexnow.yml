# IndexNow ping on every deploy.
# Bing's index (which Copilot citations ride on) lags by months without it —
# this resubmits the live sitemap to api.indexnow.org after each push to main,
# once Cloudflare Pages has had time to deploy. The key is public by design
# (it's verified via the hosted key file), so no secret is needed.
name: IndexNow

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy
        run: sleep 150

      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          KEY = "accec9b74cb0a9d99eb83c822a84a093"
          HOST = "www.afrishore.co"

          xml = urllib.request.urlopen(f"https://{HOST}/sitemap-0.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          if not urls:
              sys.exit("No URLs found in sitemap")

          payload = {
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          resp = urllib.request.urlopen(req, timeout=30)
          print(f"IndexNow: HTTP {resp.status} - submitted {len(urls)} URLs")
          PY
